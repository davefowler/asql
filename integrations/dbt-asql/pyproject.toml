[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-asql"
version = "0.1.0"
description = "Write dbt models in ASQL - a modern, readable query language"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Definite", email = "hello@definite.app"}
]
keywords = ["dbt", "asql", "sql", "analytics", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
]
requires-python = ">=3.9"
dependencies = [
    "asql>=0.1.0",
    "dbt-core>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://analyticsql.com"
Repository = "https://github.com/definite-app/asql"
Documentation = "https://analyticsql.com/integrations/dbt"

[project.entry-points."dbt.plugins"]
asql = "dbt_asql:Plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbt_asql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

