[build]
  command = "pip install -r requirements.txt -r requirements-docs.txt && python scripts/prepare_docs.py && python -m mkdocs build"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"
  # Set PLAYGROUND_URL to your Railway playground URL
  # This will be replaced in docs during build
  PLAYGROUND_URL = "https://play.analyticsql.com"

# Basic Auth Edge Function
# To disable this and use Netlify's built-in password protection instead,
# comment out the following two lines and configure password protection in
# Netlify dashboard: Site settings → Access & security → Password Protection
# [[edge_functions]]
#   function = "basic-auth"
#   path = "/*"

# Note: MkDocs generates static HTML files, so no SPA-style redirects are needed
# If you need redirects for specific paths, add them here with appropriate paths

