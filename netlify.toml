[build]
  command = "pip install -r requirements-docs.txt && python scripts/prepare_docs.py && python -m mkdocs build"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"
  # Set PLAYGROUND_URL to your Railway playground URL
  # This will be replaced in docs during build
  PLAYGROUND_URL = "https://asql-playground.railway.app"

# Basic Auth Edge Function
# To disable this and use Netlify's built-in password protection instead,
# comment out the following two lines and configure password protection in
# Netlify dashboard: Site settings → Access & security → Password Protection
# [[edge_functions]]
#   function = "basic-auth"
#   path = "/*"

# Redirects for .md URLs to proper MkDocs paths
[[redirects]]
  from = "/quick_start.md"
  to = "/quick_start/"
  status = 301

[[redirects]]
  from = "/examples.md"
  to = "/examples/"
  status = 301

[[redirects]]
  from = "/integrating.md"
  to = "/integrating/"
  status = 301

[[redirects]]
  from = "/spec.md"
  to = "/spec/"
  status = 301

[[redirects]]
  from = "/architecture.md"
  to = "/architecture/"
  status = 301

[[redirects]]
  from = "/playground.md"
  to = "/playground/"
  status = 301

[[redirects]]
  from = "/status.md"
  to = "/status/"
  status = 301

[[redirects]]
  from = "/index.md"
  to = "/"
  status = 301

