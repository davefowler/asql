version: '3.8'

services:
  asql-docs:
    build: .
    ports:
      - "5000:5000"  # Documentation server
      - "5001:5001"  # Playground
    volumes:
      # Mount docs and static files for live editing
      - ./docs:/app/docs:ro
      - ./static:/app/static:ro
      - ./asql:/app/asql:ro
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
