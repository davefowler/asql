name: Docs

# Builds the mkdocs site on every PR and push to main so a broken docs build
# fails CI. Netlify publishes the site (netlify.toml); this job only checks it.
# The compiler is a docs input (docs/macros.py runs asql at build time to
# render compiled-SQL examples), so compiler changes can break it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b  # v2.89.0
        with:
          tool: just
      - run: just docs-build
      - name: Refuse a near-empty site
        run: |
          count=$(find site -type f | wc -l)
          test "$count" -ge 5 || { echo "docs build produced only $count files"; exit 1; }
