name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      # Setup PostgreSQL natively (no Docker needed)
      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v7
        with:
          username: postgres
          password: postgres
          database: test
          port: 5432
        id: postgres
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      
      - name: Run tests
        env:
          POSTGRES_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          pytest tests/ -v --tb=short --ignore=tests/test_fivetran_examples.py
      
      - name: Run execution tests
        env:
          POSTGRES_URL: ${{ steps.postgres.outputs.connection-uri }}
        run: |
          pytest tests/test_execution.py -v --tb=short

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check code quality
        run: |
          pip install ruff
          ruff check asql/

