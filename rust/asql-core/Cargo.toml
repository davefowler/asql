[package]
name = "asql-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "ASQL front-end on top of polyglot-sql (Rust sqlglot). Spike of the cutover layers."

[dependencies]
polyglot-sql = { workspace = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
