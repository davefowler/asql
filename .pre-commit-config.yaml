# Pre-commit hooks for ASQL
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      # Run the formatter (optional - uncomment if you want auto-formatting)
      # - id: ruff-format
      #   types_or: [python, pyi]

