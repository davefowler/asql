# Manual UI Overrides for ASQL Visual Editor
#
# This file contains UI-specific metadata that can't be auto-generated:
# - Exact ASQL terminology (labels)
# - Help text and descriptions
# - Dropdown option lists with display labels
# - Operator lists for expressions
# - Placeholder text
# - Validation rules (min/max)
#
# Auto-generated base schemas are in ui_schema_generator.py
# This file only overrides what needs manual specification

operations:
  where:
    parameters:
      - name: condition
        label: condition
        operators:
          - "="
          - "!="
          - "<"
          - ">"
          - "<="
          - ">="
          - contains
          - starts with
          - ends with
          - in

  join:
    parameters:
      - name: join_type
        label: join type
        options:
          - value: inner
            label: "inner (&)"
          - value: left
            label: "left (&?)"
          - value: right
            label: "right (?&)"
          - value: full
            label: "full (?&?)"
          - value: cross
            label: "cross (*)"

      - name: table
        label: table
        placeholder: table_name

      - name: condition
        label: "on"
        help: Leave empty to infer from schema
        operators:
          - "="
          - "!="

  select:
    parameters:
      - name: columns
        label: columns
        placeholder: column_name
        help: List of columns to select

  group_by:
    parameters:
      - name: dimensions
        label: group by
        placeholder: column_name
        help: Columns to group by

      - name: aggregates
        label: aggregations
        functions:
          - count
          - sum
          - avg
          - min
          - max
          - count_distinct
        help: Aggregate functions to compute

  order_by:
    parameters:
      - name: expressions
        label: order by
        help: Columns to sort by

  limit:
    parameters:
      - name: count
        label: count
        min: 1

  # Add more operations as needed
