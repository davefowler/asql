site_name: Analytic SQL
site_description: A modern, pipeline-based query language designed for analytics
site_author: Analytic SQL Contributors
site_url: https://analyticsql.com

# Exclude internal/notes pages from build (often contain WIP syntax).
exclude_docs: |
  github_issues_to_create.md
  unimplemented_features.md
  spec_future.md
  status.md
  playground.md
  style_analysis.md
  README.md

# Repository
repo_name: asql
repo_url: https://github.com/davefowler/asql
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 Analytic SQL Contributors

# Theme
theme:
  name: material
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections       # Render section headers in sidebar
    - navigation.indexes        # Make section headers link to index pages
    - navigation.top            # Back-to-top button
    - navigation.instant        # Faster page loads
    - navigation.tracking       # URL updates as you scroll
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  logo: static/logo.svg
  icon:
    repo: fontawesome/brands/github

# Watch additional directories for hot reload
watch:
  - docs/static  # Watch docs/static/ for CSS/JS changes

# Custom CSS and JavaScript
extra_css:
  - static/docs.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js
  - static/asql-lang.js
  - static/docs.js

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: false  # Disable server-side highlighting - use highlight.js instead
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2  # Only show H1 and H2 headings in TOC

# Plugins
plugins:
  - search
  - macros:
      module_name: docs/macros
      render_by_default: false  # Don't process {{ }} as Jinja2 - only use hooks
  # - minify:
  #     minify_html: true

# Navigation
# With navigation.indexes, use index.md directly for clickable section headers
nav:
  - Home:
    - index.md
    - Quick Start: quick_start.md
    - Tutorial: tutorial.md
    - Examples: examples.md
  - Syntax:
    - syntax/index.md
    - Pipeline Basics: syntax/pipeline.md
    - Expressions & Operators: syntax/expressions.md
    - Aggregations: syntax/aggregations.md
    - Joins: syntax/joins.md
    - Dates & Time: syntax/dates.md
    - Window Functions: syntax/window-functions.md
    - CTEs & Variables: syntax/ctes.md
    - Cohorts: syntax/cohorts.md
    - Sampling: syntax/sampling.md
    - Pivot, Unpivot & Explode: syntax/pivot-unpivot.md
  - Concepts:
    - concepts/index.md
    - Pipeline Semantics: concepts/pipelines.md
    - Guaranteed Groups: concepts/guaranteed-groups.md
    - Convention Over Configuration: concepts/conventions.md
    - Function Shorthand: concepts/shorthand.md
  - Reference:
    - reference/index.md
    - Functions: reference/functions.md
    - Operators: reference/operators.md
    - Keywords: reference/keywords.md
    - Dialect Limitations: dialect-limitations.md
    - Full Specification: spec.md
  - Coming From:
    - coming-from/index.md
    - pandas: coming-from/pandas.md
    - dbt: coming-from/dbt.md
    - R / dplyr: coming-from/r.md
    - SQL: coming-from/sql.md
  - Learn More:
    - learn-more/index.md
    - Grouping Guide: group_by.md
    - Window Functions Deep Dive: window_functions.md
    - Style Guide: style_guide.md
    - Design Principles: design.md
    - Integrating ASQL: integrating.md
    - Architecture: architecture.md

