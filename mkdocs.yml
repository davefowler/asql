site_name: ASQL Documentation
site_description: A modern, pipeline-based query language that transpiles to SQL
site_author: ASQL Contributors
site_url: https://asql.dev

# Repository
repo_name: asql
repo_url: https://github.com/davefowler/asql
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 ASQL Contributors

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - getting-started.md
    - quick-start.md
  - Documentation:
    - examples.md
    - spec.md
    - architecture.md
  - Project Info:
    - status.md
    - interactive-playground.md

