[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asql"]

[project]
name = "asql"
version = "0.1.0"
description = "Analytic SQL - A modern, pipeline-based query language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # asql subclasses sqlglot's private Parser/Generator surface; a new major
    # is a migration, not a re-lock.
    "sqlglot>=30.24.0,<31.0.0",
    "jinja2>=3.0.0",
    "inflect>=7.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "duckdb>=0.9.0",
    "ruff>=0.15.0",
]
playground = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-macros-plugin>=1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "S110", "BLE001", "TRY002", "PT"]
ignore = [
    "E501",    # the formatter owns line length
    "E731",
    "E402",
    "B008",    # FastAPI Body()/Query() defaults
    "SIM102",
    "PT018",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["asql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
extra_checks = true
disallow_untyped_calls = true
warn_unused_configs = true
warn_unreachable = true
disallow_incomplete_defs = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
enable_error_code = [
    "truthy-bool",
    "redundant-expr",
    "possibly-undefined",
    "redundant-self",
    "unused-awaitable",
    "narrowed-type-not-subtype",
    "deprecated",
    "unimported-reveal",
    "exhaustive-match",
    "ignore-without-code",
]
exclude = '''(?x)(
    (^|.*/)tests/.*$
  | ^integrations/.*$
  | ^scripts/.*$
  | ^examples/.*$
  | ^docs/.*$
  | ^vscode-extension/.*$
  | (^|.*/)conftest\.py$
)'''
